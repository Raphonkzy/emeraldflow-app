# Project Identification
sonar.projectKey=emeraldflow-app
sonar.projectName=emeraldflow-app
sonar.projectVersion=1.0

# Source Code Configuration
sonar.sources=.

# Primary Language & Encoding
sonar.language=py
sonar.sourceEncoding=UTF-8

# Exclusions (Skip virtual environments, dependencies, and test files)
sonar.exclusions=venv/**, .venv/**, tests/**, **/migrations/**, **/__pycache__/**, *.pyc

# Test and Coverage Configuration
sonar.tests=tests/
sonar.python.coverage.reportPaths=coverage.xml

# SonarQube Server URL is provided dynamically via CI environment variables (SONAR_HOST_URL)