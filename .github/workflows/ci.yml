name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test-and-sonar:
    name: Unit Tests & SonarQube Scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      - name: Run unit tests with coverage
        run: |
          pytest --cov=app --cov-report=xml:coverage.xml tests/

      - name: Run SonarQube Scanner
        uses: sonarsource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  build-and-push-ecr:
    name: Build & Push to Amazon ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
      image_tag: ${{ steps.set-tag.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: set-tag
        run: echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -f Dockerfiles/app/multistage/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  update-helm-manifest:
    name: Update Helm Manifest (Pull Request)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push-ecr
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.build-and-push-ecr.outputs.image_tag }}

    steps:
      - name: Checkout Helm Repository
        uses: actions/checkout@v4
        with:
          repository: 'Raphonkzy/emeraldflow-helm'
          token: ${{ secrets.HELM_REPO_ACCESS_TOKEN || secrets.GITOPS_PAT }}
          path: helm-repo

      - name: Update Image Tag in values.yaml
        run: |
          cd helm-repo
          if [ -f "helm/emeraldflow/values.yaml" ]; then
            sed -i "s/tag:.*/tag: \"${{ env.IMAGE_TAG }}\"/g" helm/emeraldflow/values.yaml
          else
            VALUES_FILE=$(find . -name "values.yaml" | head -n 1)
            sed -i "s/tag:.*/tag: \"${{ env.IMAGE_TAG }}\"/g" "$VALUES_FILE"
          fi

      - name: Create Pull Request to Helm Repo
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.HELM_REPO_ACCESS_TOKEN || secrets.GITOPS_PAT }}
          path: helm-repo
          commit-message: "chore: update app image tag to ${{ env.IMAGE_TAG }}"
          branch: "promote-image-${{ env.IMAGE_TAG }}"
          title: "Promote App Image: ${{ env.IMAGE_TAG }}"
          body: |
            Automated PR triggered by Application CI.
            - New Image Tag: `${{ env.IMAGE_TAG }}`
            - Target: Helm values.yaml
            Please review and merge to trigger Argo CD deployment.
          base: main
